name: dev_board
subscribe:
  - name: IVT_Msg_Result_I #current (mA) id: 1043
  - name: IVT_Msg_Result_U1 #voltage 1 (all mV) id: 1044
  - name: IVT_Msg_Result_U2 #voltage 2 id: 1045
  - name: IVT_Msg_Result_U3 #voltage 3 id: 1046
  - name: IVT_Msg_Result_T #temperature (0.1C) id: 1047
  - name: IVT_Msg_Result_W #power (W) id: 1048
  - name: IVT_Msg_Result_As #accumulated Coulumb (Ampere-second) id: 1049
  - name: IVT_Msg_Result_Wh #accumulated electrical energy (Watts-hour) id: 1050

publish:
  - name: dev_board
    id: 0xC # this is the same ID as the VCU so be careful when testing
    freq_hz: 100
    signals: # The first five signals was actually used on 
    # the throttle but for this example we only use the last two signals. 
      - name: throttle_status
        slice: 0 + 8
        unit:
          type: enum
          values:
            - THROTTLE_IDLE
            - THROTTLE_RUN
            - THROTTLE_L_OUT_OF_RANGE
            - THROTTLE_R_OUT_OF_RANGE
            - THROTTLE_POSITION_IMPLAUSIBILITY
            - THROTTLE_BRAKE_PRESSED
      - name: throttle_l_pos
        slice: 8 + 16
        unit:
          type: int16_t
          name: '%' 
          offset: 0
          scale: 100/255
      - name: throttle_r_pos
        slice: 24 + 16
        unit:
          type: int16_t
          name: '%'
          offset: 0
          scale: 100/255
      - name: ss_is
        slice: 40 + 1     # Byte 5, bit 0
        unit:
          type: bool
          values:
            t: CLOSED
            f: OPEN
      - name: heartbeat
        slice: 41 + 1     # Byte 5, bit 1
        unit:
          type: bool
          values:
            t: lub
            f: DUB
      - name: test_counter
        slice: 48 + 8     # Byte 6 (perfectly aligned)
        unit:
          type: uint8_t   
          name: 'ticks'   
          offset: 0
          scale: 1
      - name: test_counter_bspd
        slice: 56 + 8     # Byte 7 (perfectly aligned)
        unit:
          type: uint8_t
          name: 'rx_ticks'
          offset: 0
          scale: 1
  