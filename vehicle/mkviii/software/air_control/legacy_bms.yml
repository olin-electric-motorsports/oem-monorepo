# Compatibility interface from ian/mkvii_structure, not new BMS firmware.
name: bms
publish:
  - name: bms_core
    id: 0x10
    freq_hz: 100
    signals:
      - name: bms_state
        slice: 0 + 2
        unit:
          type: enum
          values:
            - ACTIVE
            - CHARGING
            - FAULT
      - name: bms_fault_code
        slice: 2 + 16
        unit:
          type: uint16_t
          name: ""
          offset: 0
          scale: 1
          # See fault.h for full documentation of faults. Faults are listed
          # here for convenience.
          # - NONE
          # - (UV)  UNDERVOLTAGE
          # - (OV)  OVERVOLTAGE
          # - (UT)  UNDERTEMPERATURE
          # - (OT)  OVERTEMPERATURE
          # - (DF)  DIAGNOSTICS_FAIL
          # - (OW)  OPEN_WIRE
          # - (OC)  OVERCURRENT
          # - (PEC) PEC
          # - (CF)  CHARGER_FAULT
          # - (SM)  STATE_MACHINE
          # - (CSC) CSC_MIA
          # - (MUX) MUX_MIA
          # - (DOT) DIE_OVERTEMPERATURE
      - name: pack_voltage
        slice: 18 + 16
        unit:
          type: uint16_t
          name: V
          offset: 0
          scale: 0.0001 * 256
      - name: pack_current
        slice: 34 + 12
        unit:
          type: int16_t
          name: A
          offset: 0
          scale: .01
      - name: cell_balancing_status
        slice: 46 + 1
        unit:
          type: bool
          values:
            t: Cell balancing enabled
            f: Cell balancing disabled
      - name: regen_enabled
        slice: 47 + 1
        unit:
          type: bool
          values:
            t: Regenerative braking enabled
            f: Regenerative braking disabled
      - name: current_limiting_enabled
        slice: 48 + 1
        unit:
          type: bool
          values:
            t: Current limiting enabled
            f: Current limiting disabled
      - name: bspd_current_sense
        slice: 49 + 1
        unit:
          type: bool
          values:
            t: Current sensed
            f: No current sensed
      - name: overcurrent_detect
        slice: 50 + 1
        unit:
          type: bool
          values:
            t: Over-current detected
            f: No over-current detected
      - name: charger_connected
        slice: 51 + 1
        unit:
          type: bool
          values:
            t: Connected
            f: Disconnected

