name: rkh
subscribe:
publish:
  name: message_1
  id: 0x490 
  freq_hz: 100
  signals:
    - name: dummy_signal
      slice: 0 + 64 # start_bit + length_of_message
      unit:
        type: uint64_t
        name: 'signal from dev board'
        offset: 0
        scale: 1


