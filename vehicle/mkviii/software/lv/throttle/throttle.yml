name: throttle
subscribe:
  - name: bspd
    mob: 1
publish:
  - name: throttle
    id: 0xC
    freq_hz: 100
    signals:
      - name: throttle_status
        slice: 0 + 8
        unit:
          type: enum
          values:
            - THROTTLE_IDLE
            - THROTTLE_RUN
            - THROTTLE_L_OUT_OF_RANGE
            - THROTTLE_R_OUT_OF_RANGE
            - THROTTLE_POSITION_IMPLAUSIBILITY
            - THROTTLE_BRAKE_PRESSED
      - name: throttle_l_pos
        slice: 8 + 16
        unit:
          type: int16_t
          name: '%' 
          offset: 0
          scale: 100/255
      - name: throttle_r_pos
        slice: 24 + 16
        unit:
          type: int16_t
          name: '%'
          offset: 0
          scale: 100/255
      - name: ss_is
        slice: 40 + 1     # Byte 5, bit 0
        unit:
          type: bool
          values:
            t: CLOSED
            f: OPEN
      - name: heartbeat
        slice: 41 + 1     # Byte 5, bit 1
        unit:
          type: bool
          values:
            t: lub
            f: DUB
      - name: test_counter
        slice: 48 + 8     # Byte 6 (perfectly aligned)
        unit:
          type: uint8_t   
          name: 'ticks'   
          offset: 0
          scale: 1
      - name: test_counter_bspd
        slice: 56 + 8     # Byte 7 (perfectly aligned)
        unit:
          type: uint8_t
          name: 'rx_ticks'
          offset: 0
          scale: 1