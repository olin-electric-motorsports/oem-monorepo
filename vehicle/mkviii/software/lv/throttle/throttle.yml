name: throttle
subscribe:
  - name: bspd
    mob: 1
publish:
  - name: throttle
    id: 0xC
    freq_hz: 100
    signals:
      - name: throttle_status
        slice: 0 + 8
        unit:
          type: enum
          values:
            - THROTTLE_IDLE
            - THROTTLE_RUN
            - THROTTLE_L_OUT_OF_RANGE
            - THROTTLE_R_OUT_OF_RANGE
            - THROTTLE_POSITION_IMPLAUSIBILITY
            - THROTTLE_BRAKE_PRESSED
      - name: throttle_l_pos
        slice: 8 + 16
        unit:
          type: int16_t
          name: '%' 
          offset: 0
          scale: 100/255
      - name: throttle_r_pos
        slice: 24 + 16
        unit:
          type: int16_t
          name: '%'
          offset: 0
          scale: 100/255
      - name: ss_is
        slice: 41 + 1
        unit:
          type: bool
          values:
            t: CLOSED
            f: OPEN
      - name: heartbeat
        slice: 42 + 1
        unit:
          type: bool
          values:
            t: lub
            f: DUB
      - name: test_counter
        slice: 43 + 8     # Start at bit 43, take up 8 bits
        unit:
          type: uint8_t   # Matches your C variable type!
          name: 'ticks'   # The unit label that will print on the screen
          offset: 0
          scale: 1