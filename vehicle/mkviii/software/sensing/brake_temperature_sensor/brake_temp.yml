name: brake_temp
subscribe:
  - name: brake_temp # this is the name of the message we want to subscribe to, it has to match the name in the throttle.yml file
publish:
  - name: brake_temp
    id: 0x490 # this is the same ID as the left suspension strain message so be careful when testing
    freq_hz: 100
    signals:
      - name: temperature
        slice: 0 + 16
        unit:
          type: uint16_t
          name: ''
          offset: 0
          scale: 1
  